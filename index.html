<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" id="theme-color-meta" />
  <!-- Aplica o tema salvo antes do CSS pintar a página, para não piscar o
       tema padrão ao abrir. A lista de temas válidos é THEMES, no app.js. -->
  <script>
    try {
      var savedTheme = localStorage.getItem("fortnite-sprites-theme");
      if (/^(dark|light|storm|legendary|mythic|jungle)$/.test(savedTheme)) {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    } catch (e) {}
  </script>
  <title>Fortnite Sprites Locker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-apple.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sprites Locker" />
</head>
<body>
  <div class="install-toast" id="install-box" hidden>
    <div class="install-toast-text">
      <strong id="install-title"></strong>
      <span id="install-text"></span>
      <span class="install-offline" id="install-offline"></span>
    </div>
    <button class="install-btn" id="install-btn" type="button" hidden></button>
    <button class="modal-close-x" id="install-close" type="button" aria-label="×">×</button>
  </div>

  <div class="welcome-toast" id="welcome-toast">
    <span id="welcome-toast-text"></span>
  </div>

  <!-- Aviso com "Desfazer" depois de marcar/desmarcar ou limpar a coleção.
       Mesmo esquema do welcome-toast: sempre no DOM, alterna só .visible. -->
  <div class="undo-toast" id="undo-toast" role="status">
    <span id="undo-toast-text"></span>
    <button class="undo-btn" id="undo-btn" type="button"></button>
  </div>

  <div class="app-header">
    <div class="app-header-row">
      <!-- O rótulo já vem preenchido para não depender do JavaScript. -->
      <button class="refresh-btn" id="refresh-btn" type="button" title="Atualizar">
        <span aria-hidden="true">⟳</span><span id="refresh-label">Atualizar</span>
      </button>
      <img class="header-icon" src="icon-192.png" alt="Fortnite Sprites Locker"
           width="38" height="38" />
      <div class="header-right">
        <button class="refresh-btn account-btn" id="account-btn" type="button" title="Conta">
          <span class="account-icon" id="account-icon" aria-hidden="true">👤</span><span id="account-label">Fazer login</span>
        </button>
        <div class="lang-switch" id="lang-switch">
          <button class="lang-btn" data-lang="pt">PT</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
    <!-- Fica dentro do cabeçalho fixo, então acompanha a rolagem. -->
    <div class="search-bar" id="search-bar" hidden>
      <input class="sprite-search" id="sprite-search" type="search"
             autocomplete="off" enterkeyhint="search" />
    </div>
  </div>

  <header class="topbar">
    <h1 id="app-title"></h1>
    <p class="subtitle" id="app-subtitle"></p>
    <!-- Só aparece logado (cloud-sync.js) — atalho pro código de amigo sem
         precisar abrir o modal de Comparar. -->
    <div class="topbar-tools">
      <div class="friend-code-banner" id="friend-code-banner" hidden>
        <span id="friend-code-banner-label"></span>
        <strong id="friend-code-banner-value"></strong>
        <button class="export-copy" id="friend-code-banner-copy" type="button"></button>
      </div>
      <!-- Abre/fecha a barra de busca de Sprites (fica no cabeçalho fixo). -->
      <button class="refresh-btn search-btn" id="search-btn" type="button"
              aria-expanded="false" aria-controls="search-bar">
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"
             fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5 21 21" />
        </svg>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Alterna entre a coleção de Sprites e a lista de códigos do lobby. -->
    <div class="view-tabs" id="view-tabs" role="tablist">
      <button class="view-tab active" type="button" data-view="sprites" role="tab"></button>
      <button class="view-tab" type="button" data-view="friends" role="tab"></button>
      <button class="view-tab" type="button" data-view="codes" role="tab"></button>
      <button class="view-tab" type="button" data-view="mastery" role="tab"></button>
    </div>

    <div id="view-sprites">
    <!-- Menu de navegação rápida: um ícone por Elemental; clicar rola até o
         card. Fica grudado abaixo do cabeçalho enquanto a página rola.
         Recolhido é uma linha rolável; o botão expande em várias linhas. -->
    <nav class="sprite-nav" id="sprite-nav">
      <div class="sprite-nav-icons" id="sprite-nav-icons"></div>
      <button class="sprite-nav-toggle" id="sprite-nav-toggle" type="button">▾</button>
    </nav>

    <section class="controls">
      <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" data-rarity="all"></button>
        <button class="filter-tab" data-rarity="Rare"></button>
        <button class="filter-tab" data-rarity="Epic"></button>
        <button class="filter-tab" data-rarity="Legendary"></button>
        <button class="filter-tab" data-rarity="Mythic"></button>
        <button class="filter-tab" data-rarity="owned"></button>
        <button class="filter-tab" data-rarity="not-owned"></button>
        <button class="filter-tab" data-rarity="mastered"></button>
        <button class="filter-tab" data-rarity="not-mastered"></button>
        <button class="filter-tab" data-rarity="favorites"></button>
      </div>

      <div class="sort-row">
        <label class="sort-label" id="sort-label" for="sort-select"></label>
        <select class="sort-select" id="sort-select">
          <option value="default"></option>
          <option value="rarity"></option>
          <option value="alpha"></option>
        </select>
      </div>
    </section>

    <section class="progress">
      <div class="progress-row">
        <div class="progress-bar" id="progress-bar-owned"></div>
        <span class="progress-label" id="progress-label-owned"></span>
      </div>
      <div class="progress-row">
        <div class="progress-bar" id="progress-bar-mastered"></div>
        <span class="progress-label" id="progress-label-mastered"></span>
      </div>
      <div class="progress-actions">
        <!-- Baixa um PNG com o resumo da coleção (tenho/dominado). -->
        <button class="export-btn" id="export-btn" type="button">
          <span aria-hidden="true">📸</span><span id="export-label"></span>
        </button>
        <!-- Backup completo da coleção, para levar de um aparelho a outro. -->
        <button class="export-btn" id="backup-btn" type="button">
          <span aria-hidden="true">📦</span><span id="backup-label"></span>
        </button>
        <!-- Zera tenho/dominado/favoritos de todos os Sprites de uma vez. -->
        <button class="export-btn" id="clear-btn" type="button">
          <span aria-hidden="true">🗑️</span><span id="clear-label"></span>
        </button>
      </div>

      <!-- Confirmação inline antes de apagar tudo (mesmo padrão do "Remover
           amigo" do cloud-sync.js: sem modal, um segundo clique confirma). -->
      <div class="backup-confirm" id="clear-confirm" hidden>
        <p id="clear-confirm-text"></p>
        <div class="backup-confirm-actions">
          <button class="export-copy backup-danger" id="clear-confirm-btn" type="button"></button>
          <button class="export-close" id="clear-cancel-btn" type="button"></button>
        </div>
      </div>
    </section>

    <section id="elemental-grid" class="elemental-grid"></section>

    <p id="empty-state" class="empty-state" hidden></p>
    </div>

    <!-- Aba "Comparar": link/código de sempre (sem conta) e a
         seção de amigos via conta (cloud-sync.js, opcional). -->
    <div id="view-friends" hidden>
      <!-- Caminho de antes de existir conta: gerar/colar um link continua
           funcionando, mas fica fechado por padrão — secundário agora que dá
           pra comparar direto pela conta (seção de Amigos, mais abaixo). -->
      <div class="accordion">
        <button class="accordion-toggle" id="share-link-toggle" type="button"
                aria-expanded="false" aria-controls="share-link-panel"></button>
        <div class="accordion-panel" id="share-link-panel" hidden>
          <div class="share-section">
            <label class="share-field-label" id="share-link-label" for="share-link-input"></label>
            <div class="share-field-row">
              <input class="share-input" id="share-link-input" type="text" readonly />
              <button class="export-copy" id="share-copy-btn" type="button"></button>
            </div>
          </div>
          <div class="share-section">
            <label class="share-field-label" id="share-paste-label" for="share-paste-input"></label>
            <div class="share-field-row">
              <input class="share-input" id="share-paste-input" type="text" />
              <button class="export-copy" id="share-paste-btn" type="button"></button>
            </div>
            <p class="share-error" id="share-paste-error" hidden></p>
          </div>
        </div>
      </div>

      <!-- Comparação ao vivo com amigos, via conta (cloud-sync.js). Fica
           escondido até o cloud-sync.js confirmar que há uma sessão ativa. -->
      <div class="share-section" id="friends-section" hidden>
        <h3 id="friends-section-title"></h3>
        <p class="share-field-label" id="friends-intro"></p>

        <label class="share-field-label" id="friend-add-label" for="friend-add-input"></label>
        <div class="share-field-row">
          <input class="share-input" id="friend-add-input" type="text" />
          <button class="export-copy" id="friend-add-btn" type="button"></button>
        </div>
        <p class="share-error" id="friend-add-error" hidden></p>

        <h4 id="friend-list-title"></h4>
        <ul class="friend-list" id="friend-list"></ul>
        <p class="friend-list-loading" id="friend-list-loading" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span id="friend-list-loading-text"></span>
        </p>
        <p class="compare-list-empty" id="friend-list-empty" hidden></p>
      </div>
      <p class="share-field-label" id="friends-signed-out-hint" hidden></p>
    </div>

    <!-- Aba dos códigos do Painel de Admin: marcar os já resgatados. -->
    <div id="view-codes" hidden>
      <p class="codes-intro" id="codes-intro"></p>
      <div class="progress-row">
        <div class="progress-bar" id="codes-progress-bar"></div>
        <span class="progress-label" id="codes-progress-label"></span>
      </div>
      <!-- Código novo costuma circular no jogo antes de o IGN publicar, e a
           ação diária só lê o IGN. Este formulário é a ponte: o código entra
           na lista deste aparelho na hora, e a entrada oficial toma o lugar
           dele quando o robô finalmente trouxer o código. -->
      <div class="accordion">
        <button class="accordion-toggle" id="codes-add-toggle" type="button"
                aria-expanded="false" aria-controls="codes-add-form"></button>
        <form class="accordion-panel" id="codes-add-form" hidden>
          <div class="codes-add-field">
            <label class="share-field-label" id="codes-add-code-label"
                   for="codes-add-code"></label>
            <input class="share-input" id="codes-add-code" type="text"
                   maxlength="32" autocomplete="off" autocapitalize="off"
                   autocorrect="off" spellcheck="false" />
          </div>
          <div class="codes-add-field">
            <label class="share-field-label" id="codes-add-reward-label"
                   for="codes-add-reward"></label>
            <input class="share-input" id="codes-add-reward" type="text"
                   maxlength="80" autocomplete="off" />
          </div>
          <p class="share-error" id="codes-add-error" hidden></p>
          <div class="codes-add-actions">
            <button class="export-copy" id="codes-add-submit" type="submit"></button>
          </div>
        </form>
      </div>

      <table class="codes-table">
        <thead>
          <tr>
            <th id="codes-th-done"></th>
            <th id="codes-th-code"></th>
            <th id="codes-th-reward"></th>
          </tr>
        </thead>
        <tbody id="codes-body"></tbody>
      </table>
      <p class="codes-source" id="codes-source"></p>
    </div>

    <!-- Aba de recompensas de Domínio: desbloqueiam sozinhas pela contagem
         total de Sprites Dominados — nada para marcar à mão. -->
    <div id="view-mastery" hidden>
      <p class="codes-intro" id="mastery-intro"></p>
      <div class="progress-row">
        <div class="progress-bar" id="mastery-progress-bar"></div>
        <span class="progress-label" id="mastery-progress-label"></span>
      </div>
      <p class="codes-intro" id="mastery-next" hidden></p>

      <table class="codes-table">
        <thead>
          <tr>
            <th id="mastery-th-done"></th>
            <th id="mastery-th-level"></th>
            <th id="mastery-th-reward"></th>
          </tr>
        </thead>
        <tbody id="mastery-body"></tbody>
      </table>
      <p class="codes-source" id="mastery-source"></p>
    </div>
  </main>

  <footer class="footer">
    <p id="app-footer"></p>
  </footer>

  <button class="back-to-top" id="back-to-top" type="button" hidden>
    <span aria-hidden="true">↑</span>
  </button>

  <!-- Visualizador do resumo exportado: mostra a imagem gerada com opção
       de baixar, em vez de disparar o download direto. -->
  <div class="export-overlay" id="export-overlay" hidden>
    <div class="export-box">
      <img id="export-img" alt="" />
      <div class="export-actions">
        <button class="export-copy" id="export-copy" type="button"></button>
        <button class="export-copy" id="export-share" type="button"></button>
        <a class="export-download" id="export-download"></a>
        <button class="export-close" id="export-close" type="button"></button>
      </div>
    </div>
  </div>

  <!-- Backup: exporta a coleção inteira deste aparelho (incluindo favoritos,
       que o link de comparação não leva) e importa a de outro. -->
  <div class="export-overlay" id="backup-overlay" hidden>
    <div class="export-box share-box">
      <p class="backup-intro" id="backup-intro"></p>

      <div class="share-section">
        <label class="share-field-label" id="backup-export-label" for="backup-code-input"></label>
        <div class="share-field-row">
          <input class="share-input" id="backup-code-input" type="text" readonly />
          <button class="export-copy" id="backup-copy-btn" type="button"></button>
        </div>
        <a class="export-download" id="backup-download"></a>
      </div>

      <div class="share-section">
        <label class="share-field-label" id="backup-import-label" for="backup-paste-input"></label>
        <div class="share-field-row">
          <input class="share-input" id="backup-paste-input" type="text" />
          <button class="export-copy" id="backup-import-btn" type="button"></button>
        </div>
        <!-- Alternativa ao copiar/colar: o arquivo baixado acima. -->
        <label class="backup-file">
          <input type="file" id="backup-file-input" accept="application/json,.json,.txt" />
          <span id="backup-file-label"></span>
        </label>
        <p class="share-error" id="backup-error" hidden></p>
      </div>

      <!-- Importar sobrescreve dados: confirma antes, mostrando os números. -->
      <div class="backup-confirm" id="backup-confirm" hidden>
        <p id="backup-confirm-text"></p>
        <div class="backup-confirm-actions">
          <button class="export-copy" id="backup-merge-btn" type="button"></button>
          <button class="export-copy backup-danger" id="backup-replace-btn" type="button"></button>
          <button class="export-close" id="backup-cancel-btn" type="button"></button>
        </div>
      </div>

      <p class="backup-done" id="backup-done" hidden></p>

      <div class="export-actions">
        <button class="export-close" id="backup-close" type="button"></button>
      </div>
    </div>
  </div>

  <!-- Comparação somente-leitura contra a coleção decodificada de um link. -->
  <div class="export-overlay" id="compare-overlay" hidden>
    <div class="export-box compare-box">
      <div class="compare-header">
        <div class="compare-title-row">
          <!-- Imagem de perfil do amigo (comparação pela conta). -->
          <span class="profile-avatar profile-avatar-sm" id="compare-avatar" hidden></span>
          <h2 id="compare-title"></h2>
        </div>
        <button class="export-close" id="compare-close" type="button"></button>
      </div>
      <div class="compare-stats" id="compare-stats"></div>
      <!-- Amigo-exclusivo primeiro, o seu-exclusivo abaixo (nessa ordem). -->
      <div class="compare-lists">
        <div class="compare-list-col" id="compare-only-them"></div>
        <div class="compare-list-col" id="compare-only-you"></div>
      </div>
    </div>
  </div>

  <!-- Edição rápida de um quadradinho (Base ou variante), aberta ao clicar
       num chip da tela de comparação: marca/desmarca tenho/dominado sem
       fechar a comparação nem ir até o card do Sprite. -->
  <div class="export-overlay" id="tile-edit-overlay" hidden>
    <div class="export-box tile-edit-box" role="dialog" aria-modal="true" aria-labelledby="tile-edit-title">
      <div class="compare-header">
        <div class="compare-title-row">
          <img class="tile-edit-img" id="tile-edit-img" src="" alt="" width="40" height="40"
               onerror="variantImgFallback(this)" />
          <h2 id="tile-edit-title"></h2>
        </div>
        <button class="modal-close-x" id="tile-edit-close" type="button" aria-label="×">×</button>
      </div>
      <div class="tile-checks" id="tile-edit-checks"></div>
    </div>
  </div>

  <!-- Conta (opcional): login/senha para sincronizar a coleção entre
       aparelhos via Firebase. Sem cloud-sync.js configurado, mostra só o
       painel "não configurado" — o resto do app funciona igual, sem conta. -->
  <div class="export-overlay" id="account-overlay" hidden>
    <div class="export-box share-box">
      <div class="compare-header">
        <h2 id="account-title"></h2>
        <button class="modal-close-x" id="account-close" type="button" aria-label="×">×</button>
      </div>

      <!-- Visível por padrão, antes mesmo de o cloud-sync.js carregar (o SDK
           do Firebase vem de um CDN — pode levar um instante) — sem isto,
           abrir o modal nesse meio-tempo mostrava o formulário de login cru,
           sem as abas Login/Cadastro (só apareciam depois) e sem o listener
           de submit ainda registrado. -->
      <div class="modal-loading" id="account-loading">
        <span class="spinner" aria-hidden="true"></span>
        <span id="account-loading-text"></span>
      </div>

      <p class="backup-intro" id="account-unconfigured-text" hidden></p>

      <div class="view-tabs" id="account-mode-tabs" hidden>
        <button class="view-tab active" type="button" id="account-tab-login"></button>
        <button class="view-tab" type="button" id="account-tab-signup"></button>
      </div>

      <form id="account-login-form" class="share-section" hidden>
        <label class="share-field-label" id="account-login-email-label" for="account-login-email-input"></label>
        <input class="share-input" id="account-login-email-input" type="email" autocomplete="email" required />

        <label class="share-field-label" id="account-login-password-label" for="account-login-password-input"></label>
        <input class="share-input" id="account-login-password-input" type="password" autocomplete="current-password" required minlength="6" />

        <div class="export-actions">
          <button class="export-copy" id="account-login-submit" type="submit"></button>
        </div>
        <div class="export-actions actions-start">
          <button class="export-close" id="account-forgot-link" type="button"></button>
        </div>
      </form>

      <form id="account-signup-form" class="share-section" hidden>
        <label class="share-field-label" id="account-signup-email-label" for="account-signup-email-input"></label>
        <input class="share-input" id="account-signup-email-input" type="email" autocomplete="email" required />

        <label class="share-field-label" id="account-signup-username-label" for="account-signup-username-input"></label>
        <input class="share-input" id="account-signup-username-input" type="text" maxlength="15" autocomplete="nickname" required />

        <label class="share-field-label" id="account-signup-password-label" for="account-signup-password-input"></label>
        <input class="share-input" id="account-signup-password-input" type="password" autocomplete="new-password" required minlength="6" />
        <p class="share-field-label" id="account-password-hint" hidden></p>

        <div class="export-actions">
          <button class="export-copy" id="account-signup-submit" type="submit"></button>
        </div>
      </form>

      <p class="share-error" id="account-auth-error" hidden></p>

      <div class="share-section" id="account-signed-in" hidden>
        <!-- Imagem de perfil: um Sprite escolhido na grade abaixo (sem upload).
             Fica salva em users/{uid}.avatar (ver cloud-sync.js). -->
        <div class="profile-head">
          <span class="profile-avatar" id="account-avatar" aria-hidden="true">👤</span>
          <div class="profile-head-text">
            <!-- Definido só na criação da conta, nunca editável depois (ver
                 cloud-sync.js) — por isso é texto simples, não um campo. -->
            <p id="account-username-display"></p>
            <p id="account-signed-in-email"></p>
            <button class="export-close" id="account-avatar-change" type="button"
                    aria-expanded="false" aria-controls="account-avatar-picker"></button>
          </div>
        </div>
        <div class="avatar-picker" id="account-avatar-picker" hidden></div>
        <p class="share-error" id="account-avatar-error" hidden></p>
        <p class="backup-done" id="account-sync-status"></p>

        <label class="share-field-label" id="account-friend-code-label" for="account-friend-code-input"></label>
        <div class="share-field-row">
          <input class="share-input" id="account-friend-code-input" type="text" readonly />
          <button class="export-copy" id="account-friend-code-copy-btn" type="button"></button>
        </div>

        <div class="export-actions">
          <button class="export-copy" id="account-resync-btn" type="button"></button>
          <button class="export-copy backup-danger" id="account-logout-btn" type="button"></button>
        </div>
      </div>

      <!-- Aparência: vale com ou sem conta (o tema é deste aparelho). -->
      <div class="share-section theme-section">
        <span class="share-field-label" id="theme-title"></span>
        <div class="theme-picker" id="theme-picker" role="radiogroup"></div>
      </div>
    </div>
  </div>

  <!-- Novidades: aparece uma vez por aparelho (ver NEWS_KEY no app.js). -->
  <div class="export-overlay" id="news-overlay" hidden>
    <div class="export-box share-box news-box" role="dialog" aria-modal="true" aria-labelledby="news-title">
      <div class="compare-header">
        <h2 id="news-title"></h2>
        <button class="modal-close-x" id="news-close" type="button" aria-label="×">×</button>
      </div>
      <ul class="news-list" id="news-list"></ul>
      <div class="export-actions">
