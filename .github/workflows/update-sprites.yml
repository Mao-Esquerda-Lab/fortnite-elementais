name: Update Sprites from the IGN wiki

on:
  schedule:
    # Diariamente às 06:17 UTC (horário "quebrado" evita os picos do Actions).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-sprites
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Detect new sprites on the IGN wiki
        run: node scripts/update-sprites.mjs

      # A main é protegida (mudanças só via pull request), então o robô
      # publica numa branch auxiliar e abre/atualiza um PR. O merge do PR
      # dispara o deploy do Pages normalmente.
      - name: Commit to the auto branch and open/update a PR
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/elementals-auto.js; then
            echo "Nenhuma mudança para publicar."
            exit 0
          fi
          NEW=$(git diff -- data/elementals-auto.js \
            | sed -n 's/^+.*"wikiName": "\(.*\)".*/\1/p' | paste -sd ', ' -)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elementals-auto.js
          git commit -m "Add new Sprites from the IGN wiki: $NEW"
          git push --force origin HEAD:auto/update-sprites
          if [ -z "$(gh pr list --head auto/update-sprites --state open --json number --jq '.[].number')" ]; then
            # Se falhar com "not permitted to create pull requests", habilite
            # "Allow GitHub Actions to create and approve pull requests" em
            # Settings > Actions > General. A branch auto/update-sprites já
            # foi enviada — dá para abrir o PR manualmente enquanto isso.
            gh pr create --base main --head auto/update-sprites \
              --title "Novos Sprites do wiki do IGN: $NEW" \
              --body "$(cat <<'EOF'
          O robô de atualização encontrou Sprites novos no [wiki do IGN](https://www.ign.com/wikis/fortnite/Sprites_Checklist_and_Guide_(Chapter_7_Season_4)_-_All_Variants_List). Eles entram no app com nome em inglês e habilidade "ainda não revelada" até serem curados.

          Os que aparecem na seção "Unreleased Sprites List" do IGN entram marcados como `upcoming`: ganham o selo "Em breve", ficam com as caixinhas travadas e não contam no progresso nem no código de comparação.

          Ao fazer o merge, o deploy do GitHub Pages roda sozinho e o app atualiza.

          Para curar depois, mova as entradas de `data/elementals-auto.js` para `data/elementals.js` preenchendo: nome e habilidade em português **como aparecem no jogo** (pt-BR — ex.: "Killswitch" é "Disruptor"), o texto em inglês e as exceções de variantes.
          EOF
          )"
          else
            echo "PR já aberto — a branch foi atualizada."
          fi
