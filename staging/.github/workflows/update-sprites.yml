name: Update Sprites and codes from the IGN wiki

on:
  schedule:
    # Diariamente às 06:17 UTC (horário "quebrado" evita os picos do Actions).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-sprites
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Detect new sprites and codes on the IGN wiki
        run: node scripts/update-sprites.mjs

      # A main é protegida (mudanças só via pull request), então o robô
      # publica numa branch auxiliar e abre/atualiza um PR. O merge do PR
      # dispara o deploy do Pages normalmente.
      - name: Commit to the auto branch and open/update a PR
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/elementals-auto.js data/cheat-codes-auto.js
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para publicar."
            exit 0
          fi
          SPRITES=$(git diff --cached -- data/elementals-auto.js \
            | sed -n 's/^+.*"wikiName": "\(.*\)".*/\1/p' | paste -sd ', ' -)
          CODES=$(git diff --cached -- data/cheat-codes-auto.js \
            | sed -n 's/^+.*"code": "\(.*\)".*/\1/p' | paste -sd ', ' -)
          NEW=$(printf '%s' "${SPRITES:+Sprites: $SPRITES}${SPRITES:+${CODES:+; }}${CODES:+códigos: $CODES}")
          # Só marcar expirados também é mudança, e aí as duas listas acima
          # ficam vazias — o assunto do commit precisa dizer alguma coisa.
          NEW=${NEW:-atualização da lista}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza dados a partir do wiki do IGN ($NEW)"
          git push --force origin HEAD:auto/update-sprites
          if [ -z "$(gh pr list --head auto/update-sprites --state open --json number --jq '.[].number')" ]; then
            # Se falhar com "not permitted to create pull requests", habilite
            # "Allow GitHub Actions to create and approve pull requests" em
            # Settings > Actions > General. A branch auto/update-sprites já
            # foi enviada — dá para abrir o PR manualmente enquanto isso.
            gh pr create --base main --head auto/update-sprites \
              --title "Dados novos do wiki do IGN: $NEW" \
              --body "$(cat <<'EOF'
          O robô de atualização encontrou novidades no wiki do IGN — na [página dos Sprites](https://www.ign.com/wikis/fortnite/Sprites_Checklist_and_Guide_(Chapter_7_Season_4)_-_All_Variants_List) e/ou na [dos códigos do Painel de Admin](https://www.ign.com/wikis/fortnite/All_Admin_Panel_Lobby_Hack_Codes_For_Free_Rewards).

          **Sprites novos** entram no app com nome em inglês e habilidade "ainda não revelada" até serem curados. Os que aparecem na seção "Unreleased Sprites List" entram marcados como `upcoming`: ganham o selo "Em breve", ficam com as caixinhas travadas e não contam no progresso nem no código de comparação.

          **Códigos novos** entram com a recompensa em inglês nos dois idiomas (`untranslated: true`) até serem traduzidos. **Códigos que sumiram** da página do IGN entram em `AUTO_EXPIRED_CODES`: continuam visíveis no app, riscados e com o selo "Expirado", no fim da tabela, e saem da conta do progresso. Se um código voltar à página, ele desexpira sozinho na execução seguinte.

          Ao fazer o merge, o deploy do GitHub Pages roda sozinho e o app atualiza.

          Para curar depois, mova as entradas de `data/elementals-auto.js` para `data/elementals.js` (ou de `data/cheat-codes-auto.js` para `data/cheat-codes.js`) preenchendo o texto em português **como aparece no jogo** (pt-BR — ex.: "Killswitch" é "Disruptor", "Cheat Master" é "Trapaceiro").
          EOF
          )"
          else
            echo "PR já aberto — a branch foi atualizada."
          fi
